<!doctype html>
<html lang="en">

<head>
	<title>Wolfinch Screener</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
		rel="stylesheet">
	<link href="screener/stylesheet.css" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css">

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<script type="text/javascript" charset="utf8"
		src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.js"></script>
	<script src="https://momentjs.com/downloads/moment.min.js"></script>

	<script type="text/javascript">
		/* ── Globals ── */
		var table;
		var g_total_signals = 0;
		var g_new_30m = 0, g_new_2h = 0, g_new_24h = 0;

		$(document).ready(function () {
			load_screener_tables();
			setInterval(function () {
				console.log("refresh tables");
				load_screener_tables();
			}, 1200000);
		});

		/* ── Pill-menu toggle ── */
		function toggleMenu(menuId) {
			document.querySelectorAll('.pill-menu').forEach(function (m) {
				if (m.id !== menuId) m.classList.remove('show');
			});
			var el = document.getElementById(menuId);
			if (el) el.classList.toggle('show');
		}
		document.addEventListener('click', function (e) {
			if (!e.target.closest('.pill-select')) {
				document.querySelectorAll('.pill-menu').forEach(function (m) { m.classList.remove('show'); });
			}
		});

		/* ── Build screener card containers (first load only) ── */
		function add_screener_tables(scrn_data) {
			Object.keys(scrn_data).forEach(function (scrn_name) {
				if (!scrn_data[scrn_name]) { console.log("invalid data for " + scrn_name); return; }
				if (!scrn_data[scrn_name]["format"] || scrn_data[scrn_name]["format"].length === 0) {
					console.log("invalid screen format for " + scrn_name); return;
				}
				if (!scrn_data[scrn_name]["data"] || scrn_data[scrn_name]["data"].length === 0) {
					console.log("invalid screen data for " + scrn_name); return;
				}
				if ($("#" + scrn_name).length) { console.log("table exists " + scrn_name); return; }

				var th = "";
				for (var i = 0; i < Object.keys(scrn_data[scrn_name]["format"]).length; i++) {
					th += '<th>0</th>';
				}

				var card_html = `
        <div class="card">
          <div class="card-head">
            <div class="card-title">
              <span class="dot"></span>
              ${scrn_name}
            </div>
            <span class="chip" id="chip_${scrn_name}">—</span>
          </div>
          <div class="tbl-wrap">
            <table id="${scrn_name}" class="display compact scrn-table" style="width:100%">
              <thead><tr>${th}</tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>`;

				$("#scrnTable").append(card_html);
			});
		}

		/* ── Fetch data from API ── */
		function load_screener_tables() {
			console.log("loading screener data");
			$.ajax({
				type: 'GET',
				url: 'screener/api/data',
				dataType: 'json',
				success: function (data) {
					console.log("get screener/data success!");
					add_screener_tables(data);
					// reset global counters
					g_total_signals = 0; g_new_30m = 0; g_new_2h = 0; g_new_24h = 0;
					Object.keys(data).forEach(function (scrn_name) {
						if (data[scrn_name]) load_tables(scrn_name, data[scrn_name]);
					});
					update_stat_bar();
				},
				error: function (xhr, error) {
					console.log("get screener/data failed!");
					alert(error);
				}
			});
		}

		/* ── Update stat bar counts ── */
		function update_stat_bar() {
			$("#stat_total").text(g_total_signals);
			$("#stat_30m").text(g_new_30m);
			$("#stat_2h").text(g_new_2h);
			$("#stat_24h").text(g_new_24h);
			$("#stat_updated").text("just now");
		}

		/* ── Load / refresh a single screener table ── */
		function load_tables(scrn_name, data_d) {
			console.log("load scrn_name " + scrn_name);
			var fmt = data_d["format"];
			var data = data_d["data"];
			var sort = data_d["sort"];
			var hidden = data_d["hidden"];

			if (!data || !fmt) { console.log("invalid data or format"); return; }

			/* Count signals for stat bar */
			var now = Date.now() / 1000;
			(data || []).forEach(function (row) {
				if (row.time) {
					g_total_signals++;
					if (now - 30 * 60 <= row.time) g_new_30m++;
					if (now - 2 * 3600 <= row.time) g_new_2h++;
					if (now - 24 * 3600 <= row.time) g_new_24h++;
				}
			});

			/* Update row-count chip */
			var chip = document.getElementById("chip_" + scrn_name);
			if (chip) chip.textContent = (data.length || 0) + " rows";

			/* Already initialized – just reload data */
			if ($.fn.dataTable.isDataTable('#' + scrn_name)) {
				var t = $.fn.dataTable.tables({ api: true }).table('#' + scrn_name);
				t.clear().draw().rows.add(data).columns.adjust().draw();
				return;
			}

			/* Build column definitions */
			var columns = [];
			var sort_idx = 0;
			Object.keys(fmt).forEach(function (key, idx) {
				if (sort && key === sort) sort_idx = idx;

				var visible = true;
				if (hidden && hidden.length > 0) {
					for (var i = 0; i < hidden.length; i++) {
						if (key === hidden[i]) { visible = false; }
					}
				}

				if (key === "time") {
					columns.push({
						title: fmt["time"], data: "time",
						render: function (time, type) {
							if (time != null && time !== 'None' && time !== undefined) {
								var d = moment(time * 1000);
								return type === "sort" ? d.unix() : d.fromNow();
							}
							return "-";
						},
						name: "time", visible: visible
					});
				} else if (key === "symbol") {
					columns.push({
						title: fmt["symbol"], data: "symbol",
						render: function (symbol, type) {
							if (type === "sort") return symbol;
							return '<a href="https://finance.yahoo.com/quote/' + symbol + '" target="_blank">' + symbol + '</a>';
						},
						name: "symbol"
					});
				} else {
					columns.push({ title: fmt[key], data: key, name: key, visible: visible });
				}
			});

			/* Init DataTable */
			table = $('#' + scrn_name).DataTable({
				data: data,
				processing: true,
				pageLength: 25,
				columns: columns,
				order: [[sort_idx, "desc"]],
				responsive: true,
				scrollY: '35vh',
				fixedColumns: { heightMatch: 'none' },
				"rowCallback": function (nRow, aData) {
					var now_s = Date.now() / 1000;

					/* Recency row class */
					$(nRow).removeClass('row-hot row-warm row-cool');
					if (aData.time && now_s - 24 * 3600 <= aData.time) {
						if (now_s - 30 * 60 <= aData.time) $(nRow).addClass('row-hot');
						else if (now_s - 2 * 3600 <= aData.time) $(nRow).addClass('row-warm');
						else $(nRow).addClass('row-cool');
					}

					/* Price-change cell highlight */
					for (var i = 0; i < this.dataTableSettings[0].aoColumns.length; i++) {
						if (this.dataTableSettings[0].aoColumns[i].data === "cur_price_change") {
							var cell = $(nRow).find('td:eq(' + i + ')');
							cell.removeClass('cell-up cell-down');
							if (aData["cur_price_change"] < aData["price_change"]) cell.addClass('cell-down');
							else if (aData["cur_price_change"] >= aData["price_change"]) cell.addClass('cell-up');
							break;
						}
					}
				}
			});
		}
	</script>
</head>

<body>

	<!-- ── Top Nav ── -->
	<nav class="top-nav">
		<a class="brand-link" href="/">
			<span class="b-accent">W</span>olfinch
			<span class="b-sub">/ Screener</span>
		</a>
		<div class="nav-sep"></div>
		<div class="pill-select">
			<div class="pill-btn" onclick="toggleMenu('scrn-menu')">
				All Screeners <span class="caret">▾</span>
			</div>
			<ul class="pill-menu" id="scrn-menu">
				<li><a href="#">All Screeners</a></li>
			</ul>
		</div>
		<div class="nav-links">
			<a href="#" class="active">Screener</a>
			<a href="/wolfinch/chart.html">Charts</a>
			<a href="/wolfinch/trading.html">Trading</a>
		</div>
	</nav>

	<!-- ── Stat Bar ── -->
	<div class="stat-bar">
		<div class="stat-item">
			<span class="stat-label">Total Signals</span>
			<span class="stat-value sv-cyan" id="stat_total">—</span>
		</div>
		<div class="stat-item">
			<span class="stat-label">New (30 min)</span>
			<span class="stat-value sv-green" id="stat_30m">—</span>
		</div>
		<div class="stat-item">
			<span class="stat-label">New (2 hr)</span>
			<span class="stat-value sv-yellow" id="stat_2h">—</span>
		</div>
		<div class="stat-item">
			<span class="stat-label">New (24 hr)</span>
			<span class="stat-value" id="stat_24h">—</span>
		</div>
		<div class="stat-item">
			<span class="stat-label">Last Updated</span>
			<span class="stat-value" style="font-size:.78rem" id="stat_updated">—</span>
		</div>
	</div>

	<!-- ── Page Body ── -->
	<div class="page-body">
		<div id="scrnTable" class="scrn-grid"></div>
	</div>

	<footer class="footer">© 2017-2026 Wolfinch Screener</footer>

</body>

</html>
